name: Deploy PulseChat Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase web config
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.PULSECHAT_FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_WEB_CONFIG" ]; then
            printf 'window.PULSECHAT_FIREBASE_CONFIG = %s;\n' "$FIREBASE_WEB_CONFIG" > web/config.js
          else
            printf 'window.PULSECHAT_FIREBASE_CONFIG = null;\n' > web/config.js
          fi

      - name: Validate site
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
          test -f web/config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
